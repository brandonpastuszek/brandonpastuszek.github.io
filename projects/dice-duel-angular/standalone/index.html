<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10140f">
<title>Dice Duel</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090b09}body,button{font-family:Arial,sans-serif;color:#f6f3e9}button{font:inherit}.table{--yellow:#ffcb45;--coral:#ff6b5c;min-height:100dvh;display:grid;grid-template-rows:minmax(145px,23vh) 1fr minmax(145px,23vh);background:radial-gradient(circle at 50% 50%,#44673c40,transparent 34%),repeating-linear-gradient(102deg,#ffffff05 0 1px,transparent 1px 5px),#10140f;overflow:hidden}.player{position:relative;padding:clamp(18px,3vw,34px) clamp(20px,5vw,68px);background:#080a089e;opacity:.56;transition:.25s}.player.active{opacity:1;background:#111610f0}.player.active:after{content:"";position:absolute;left:8%;right:8%;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--yellow),transparent);box-shadow:0 0 18px #ffcb4599}.player.top{transform:rotate(180deg);border-top:1px solid #ffffff14}.player.bottom{border-top:1px solid #ffffff14}.player.bottom:after{background:linear-gradient(90deg,transparent,var(--coral),transparent)}.player-content{display:flex;justify-content:space-between;align-items:center;max-width:980px;margin:auto}.identity{display:flex;align-items:center;gap:14px}.dot{width:17px;height:17px;border-radius:50%;box-shadow:0 0 20px currentColor}.top .dot{color:var(--yellow);background:var(--yellow)}.bottom .dot{color:var(--coral);background:var(--coral)}.identity p,.score span{margin:0 0 2px;color:#90998e;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.identity h2{margin:0;font-size:clamp(22px,3vw,34px);letter-spacing:-.04em}.score{text-align:right}.score strong{display:block;font-family:monospace;font-size:clamp(32px,5vw,56px);line-height:.9}.rounds{display:flex;justify-content:center;gap:8px;margin-top:16px}.rounds span{padding:6px 11px;border:1px solid #343a32;border-radius:99px;color:#7e877c;font-size:10px;font-weight:800}.rounds b{margin-left:5px;color:#f6f3e9}.arena{width:min(850px,100%);margin:auto;padding:16px 20px;text-align:center}.brand{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.brand h1{margin:0;font-size:23px;letter-spacing:-.04em}.logo{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--yellow);color:#15170f;box-shadow:0 4px 12px #ffcb4540}.tagline{width:100%;margin:-4px 0 0;color:#7f877b;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.turn{margin:14px auto 12px;max-width:610px}.meta{display:flex;justify-content:space-between;color:#929a8f;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.roll-dots{display:flex;gap:5px;align-items:center}.roll-dots i{width:7px;height:7px;border:1px solid #5f675c;border-radius:50%}.roll-dots i.used{background:var(--yellow);border-color:var(--yellow)}.turn h3{margin:7px 0 0;font-size:clamp(17px,3vw,26px)}.dice{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,1.7vw,15px);max-width:720px;margin:auto}.die{position:relative;aspect-ratio:1;padding:17%;border:2px solid transparent;border-radius:clamp(12px,2.2vw,22px);background:#f4f0e4;box-shadow:0 9px 0 #c9c3b7,0 17px 28px #0005;cursor:pointer;transition:.15s}.die:disabled{cursor:default}.die.held{border-color:var(--yellow);filter:drop-shadow(0 0 9px #ffcb4580);transform:translateY(-6px)}.hold{position:absolute;top:-23px;left:50%;transform:translateX(-50%);color:#737b70;font-size:9px;font-weight:800;text-transform:uppercase;opacity:0}.die.enabled .hold,.die.held .hold{opacity:1}.die.held .hold{color:var(--yellow)}.pips{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%}.pip{place-self:center;width:clamp(6px,1.2vw,13px);aspect-ratio:1;border-radius:50%;background:#191b18;opacity:0}.pip.on{opacity:1}.shaking .die:not(.held){animation:shake .16s infinite alternate}@keyframes shake{from{transform:rotate(-4deg) translateY(-2px)}to{transform:rotate(4deg) translateY(2px)}}.current{margin:16px auto 0;color:#828a7f;font-size:11px;font-weight:700;visibility:hidden}.current.show{visibility:visible}.current strong{margin-left:6px;color:#fff;font-family:monospace;font-size:20px}.actions{display:flex;justify-content:center;gap:10px;min-height:64px;margin-top:10px}.actions button{border:0;cursor:pointer;font-weight:800}.actions button:disabled{opacity:.34;cursor:default}.roll{display:flex;flex-direction:column;min-width:200px;padding:10px 28px;border-radius:15px;background:var(--yellow);color:#171910;box-shadow:0 6px 0 #b78415}.roll span{font-size:16px}.roll small{margin-top:2px;font-size:9px;text-transform:uppercase;letter-spacing:.08em;opacity:.64}.bank{padding:0 20px;border:1px solid #444b40!important;border-radius:15px;background:#22271f;color:#f3f0e7}.winner{display:flex;align-items:center;gap:14px;padding:10px 12px 10px 18px;border:1px solid #3e463b;border-radius:17px;background:#1c211a}.winner span{color:#929a8f;font-size:10px;font-weight:800;text-transform:uppercase}.winner strong{font-family:monospace;font-size:23px}.winner button{padding:12px 18px;border-radius:11px;background:var(--yellow);color:#171910}
@media(max-width:600px){.table{grid-template-rows:minmax(125px,20vh) 1fr minmax(125px,20vh)}.player{padding:14px 18px}.rounds{margin-top:10px}.arena{padding:12px}.tagline{display:none}.turn{margin:10px auto 27px}.meta{font-size:8px}.dice{gap:5px}.die{border-radius:11px;box-shadow:0 6px 0 #c9c3b7,0 12px 22px #0005}.hold{top:-18px;font-size:7px}.current{margin-top:11px}.actions{margin-top:6px}.roll{min-width:165px;padding-inline:17px}.bank{padding-inline:12px;font-size:12px}}
@media(max-height:700px) and (orientation:landscape){.table{grid-template-rows:115px 1fr 115px}.player{padding-block:11px}.rounds{margin-top:7px}.arena{padding-block:6px}.tagline{display:none}.turn{margin:5px auto 22px}.current{margin-top:7px}.actions{margin-top:2px;min-height:54px}.roll{padding-block:6px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.dice{grid-template-columns:repeat(5,minmax(48px,82px));justify-content:center;gap:clamp(6px,1.5vw,13px);max-width:520px}
.die{border-radius:clamp(10px,1.4vw,15px);box-shadow:0 7px 0 #c9c3b7,0 13px 22px #0005}
@media(max-width:600px){.dice{grid-template-columns:repeat(5,minmax(44px,64px));gap:5px}.die{border-radius:9px;box-shadow:0 5px 0 #c9c3b7,0 10px 18px #0005}}
.dice{perspective:700px}.shaking .die:not(.held){animation:toss .44s cubic-bezier(.2,.8,.3,1) infinite;transform-style:preserve-3d;will-change:transform}.shaking .die:nth-child(2){animation-delay:-.11s;animation-direction:reverse}.shaking .die:nth-child(3){animation-delay:-.23s}.shaking .die:nth-child(4){animation-delay:-.34s;animation-direction:reverse}.shaking .die:nth-child(5){animation-delay:-.17s}@keyframes toss{0%{transform:translate3d(-4px,5px,0) rotateX(0) rotateY(0) rotateZ(-3deg);box-shadow:0 3px 0 #c9c3b7,0 7px 12px #0004}38%{transform:translate3d(4px,-22px,34px) rotateX(145deg) rotateY(105deg) rotateZ(12deg);box-shadow:0 18px 0 #c9c3b7,0 32px 28px #0003}72%{transform:translate3d(-2px,-8px,12px) rotateX(280deg) rotateY(230deg) rotateZ(-8deg)}100%{transform:translate3d(2px,4px,0) rotateX(360deg) rotateY(360deg) rotateZ(2deg);box-shadow:0 4px 0 #c9c3b7,0 8px 14px #0005}}
.winner{position:relative;border-color:#ffcb45;animation:winner-pop .72s cubic-bezier(.16,1.4,.3,1),winner-glow 1.6s ease-in-out infinite alternate}.winner strong{animation:score-pop .6s .22s cubic-bezier(.16,1.5,.3,1) both}.confetti{position:fixed;inset:0;z-index:5;overflow:hidden;pointer-events:none}.confetti i{position:absolute;left:calc(var(--piece)*5.5% + 2%);top:42%;width:8px;height:14px;border-radius:2px;background:hsl(calc(var(--piece)*39deg) 88% 62%);animation:confetti-burst 1.8s cubic-bezier(.12,.7,.25,1) calc(var(--piece)*-.035s) both}@keyframes winner-pop{from{opacity:0;transform:scale(.55) translateY(18px)}to{opacity:1;transform:scale(1)}}@keyframes winner-glow{from{box-shadow:0 0 10px #ffcb4526}to{box-shadow:0 0 34px #ffcb4580}}@keyframes score-pop{from{opacity:0;transform:scale(.3) rotate(-8deg)}to{opacity:1;transform:scale(1)}}@keyframes confetti-burst{0%{opacity:0;transform:translate3d(0,0,0) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translate3d(0,52vh,0) rotate(calc(var(--piece)*95deg))}}
.confetti i{animation-name:confetti-fall;animation-duration:1.8s;animation-timing-function:cubic-bezier(.12,.7,.25,1);animation-fill-mode:both}@keyframes confetti-fall{0%{opacity:0;transform:translate3d(0,0,0) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translate3d(0,52vh,0) rotate(720deg)}}
.hold{top:auto;bottom:5px;z-index:2;padding:2px 5px;border-radius:5px;background:#141612c7;color:#fff;font-size:7px}
.shaking .die:not(.held){animation:toss-physical .52s cubic-bezier(.18,.72,.22,1) both;transform-style:preserve-3d}.shaking .die:nth-child(2){animation-delay:.025s;animation-direction:reverse}.shaking .die:nth-child(3){animation-delay:.05s}.shaking .die:nth-child(4){animation-delay:.075s;animation-direction:reverse}.shaking .die:nth-child(5){animation-delay:.1s}@keyframes toss-physical{0%{transform:translate3d(-6px,2px,0) rotate3d(1,.8,.25,0) scale(1);box-shadow:0 5px 0 #c9c3b7,0 9px 14px #0005}42%{transform:translate3d(5px,-26px,38px) rotate3d(1,.8,.25,255deg) scale(1.04);box-shadow:0 20px 0 #c9c3b7,0 38px 30px #0003}78%{transform:translate3d(-2px,-5px,8px) rotate3d(1,.8,.25,510deg) scale(.98);box-shadow:0 9px 0 #c9c3b7,0 16px 20px #0004}91%{transform:translate3d(1px,2px,0) rotate3d(1,.8,.25,545deg) scale(1.03)}100%{transform:translate3d(0,0,0) rotate3d(1,.8,.25,540deg) scale(1);box-shadow:0 7px 0 #c9c3b7,0 13px 22px #0005}}
.winner-backdrop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:22px;background:#050705db;backdrop-filter:blur(10px);animation:win-fade .35s ease both}.winner{position:relative;display:flex;width:min(420px,92vw);flex-direction:column;align-items:center;gap:8px;padding:32px 28px 28px;border:1px solid #ffcb45;border-radius:28px;background:radial-gradient(circle at 50% 0,#3c371d,#171b15 58%)}.winner h2{margin:4px 0 8px;font-size:clamp(30px,7vw,46px);letter-spacing:-.05em}.winner p{margin:0;color:#929a8f;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.winner strong{font-size:34px}.winner button{margin-top:12px;padding:14px 26px}.winner-kicker{color:#ffcb45!important;letter-spacing:.18em!important}.trophy{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:#ffcb45;color:#161910;font-size:32px;box-shadow:0 0 35px #ffcb4559;animation:trophy-in .8s .15s cubic-bezier(.16,1.4,.3,1) both}@keyframes win-fade{from{opacity:0}to{opacity:1}}@keyframes trophy-in{from{opacity:0;transform:translateY(-22px) rotate(-35deg) scale(.5)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="table">
  <section class="player top" id="p0"><div class="player-content"><div class="identity"><span class="dot"></span><div><p>North side</p><h2>Player 1</h2></div></div><div class="score"><span>Total</span><strong id="total0">0</strong></div></div><div class="rounds" id="rounds0"></div></section>
  <section class="arena">
    <header class="brand"><span class="logo">●</span><h1>Dice Duel</h1><p class="tagline">Highest hand after 3 rolls wins</p></header>
    <div class="turn"><div class="meta"><span id="turn">Turn 1 of 3</span><span class="roll-dots"><i></i><i></i><i></i><b id="left">3 rolls left</b></span></div><h3 id="status">Player 1, roll the dice</h3></div>
    <div class="dice" id="dice"></div>
    <div class="current" id="current">Current hand <strong id="hand">5</strong></div>
    <div class="actions" id="actions"><button class="roll" id="roll"><span>Roll dice</span><small>Start your turn</small></button><button class="bank" id="bank" disabled>Bank score</button></div>
  </section>
  <section class="player bottom" id="p1"><div class="player-content"><div class="identity"><span class="dot"></span><div><p>South side</p><h2>Player 2</h2></div></div><div class="score"><span>Total</span><strong id="total1">0</strong></div></div><div class="rounds" id="rounds1"></div></section>
</main>
<script>
(()=>{"use strict";
const $=s=>document.querySelector(s),diceEl=$("#dice"),actions=$("#actions");
let players=[[ ],[ ]],active=0,dice=[1,1,1,1,1],held=[false,false,false,false,false],rolls=0,rolling=false,over=false;
const patterns={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const total=i=>players[i].reduce((a,b)=>a+b,0),hand=()=>dice.reduce((a,b)=>a+b,0),rnd=()=>Math.floor(Math.random()*6)+1;
function render(){
  for(let p=0;p<2;p++){$("#p"+p).classList.toggle("active",active===p&&!over);$("#total"+p).textContent=total(p);$("#rounds"+p).innerHTML=`Final hand <b>${players[p][0]??"—"}</b>`}
  $("#turn").textContent=`Player ${active+1}’s turn`;$("#left").textContent=`${3-rolls} rolls left`;document.querySelectorAll(".roll-dots i").forEach((d,i)=>d.classList.toggle("used",i<rolls));
  $("#status").textContent=over?(total(0)===total(1)?"It’s a draw!":`Player ${total(0)>total(1)?1:2} wins!`):rolls===0?`Player ${active+1}, roll the dice`:rolls===3?`Turn score: ${hand()}`:"Tap dice to hold, then roll again";
  diceEl.classList.toggle("shaking",rolling);diceEl.innerHTML=dice.map((v,i)=>`<button class="die ${held[i]?"held":""} ${rolls>0&&rolls<3&&!rolling&&!over?"enabled":""}" data-i="${i}" ${rolls===0||rolls>=3||rolling||over?"disabled":""} aria-label="Die ${i+1}, value ${v}${held[i]?", held":""}"><span class="hold">${held[i]?"Held":"Hold"}</span><span class="pips">${[0,1,2,3,4,5,6,7,8].map(n=>`<i class="pip ${patterns[v].includes(n)?"on":""}"></i>`).join("")}</span></button>`).join("");
  $("#current").classList.toggle("show",rolls>0);$("#hand").textContent=hand();
  if(!over){$("#roll").disabled=rolling||rolls>=3;$("#roll span").textContent=rolling?"Rolling…":rolls===0?"Roll dice":"Roll again";$("#roll small").textContent=rolls===0?"Start your turn":`${held.filter(Boolean).length} held`;$("#bank").disabled=rolls===0||rolling;$("#bank").textContent=rolls===3?"Finish turn":"Bank score"}
}
function roll(){if(rolling||over||rolls>=3)return;rolling=true;render();let ticks=0,timer=setInterval(()=>{dice=dice.map((v,i)=>held[i]?v:rnd());render();if(++ticks>=10){clearInterval(timer);rolls++;rolling=false;render();if(rolls===3)setTimeout(()=>{if(!over&&rolls===3)bank()},700)}},55)}
function bank(){if(!rolls||rolling||over)return;players[active].push(hand());if(active===1){over=true;const winner=total(0)===total(1)?"It’s a draw!":`Player ${total(0)>total(1)?1:2} wins!`;actions.innerHTML=`<div class="winner-backdrop"><div class="winner"><div class="confetti" aria-hidden="true">${Array.from({length:28},(_,i)=>`<i style="left:${i*3.5+1}%;background:hsl(${i*31}deg 88% 62%);animation-delay:${i*-.025}s"></i>`).join("")}</div><span class="winner-kicker">Game over</span><div class="trophy">★</div><h2>${winner}</h2><p>Final score</p><strong>${total(0)} — ${total(1)}</strong><button id="again">Play again</button></div></div>`;render();$("#again").onclick=restart;return}active=1;dice=[1,1,1,1,1];held=[false,false,false,false,false];rolls=0;render()}
function restart(){players=[[],[]];active=0;dice=[1,1,1,1,1];held=[false,false,false,false,false];rolls=0;rolling=false;over=false;actions.innerHTML='<button class="roll" id="roll"><span>Roll dice</span><small>Start your turn</small></button><button class="bank" id="bank" disabled>Bank score</button>';bind();render()}
function bind(){$("#roll").onclick=roll;$("#bank").onclick=bank}
diceEl.onclick=e=>{const b=e.target.closest(".die");if(!b||b.disabled)return;const i=Number(b.dataset.i);held[i]=!held[i];render()};bind();render()
})();
</script>
</body>
</html>
